<!-- Quadro com título, subtítulo e gráfico. Uso: include com p=painel (ver views.comum.painel) -->
<div class="cartao" {% if p.ancora %}id="{{ p.ancora }}"{% endif %}>
    <h2 class="titulo-secao">{{ p.titulo }}</h2>
    {% if p.subtitulo %}<p class="subtitulo">{{ p.subtitulo }}</p>{% endif %}
    <div class="mt-3">{{ p.html|safe }}</div>
</div>
