# Configuração do site no Render (https://render.com), lida automaticamente
# quando o repositório é conectado como "Blueprint".
services:
  - type: web
    name: painel-acidentes-prf
    runtime: python
    plan: free
    # preparar_dados grava os CSVs já tratados em data/cache, que abrem bem mais rápido
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py preparar_dados
    # Um processo e uma thread: os 4 anos de dados ocupam ~310 MB (o plano gratuito
    # tem 512 MB), e com só 0,1 CPU várias threads não ajudam e ainda podem travar
    # importando módulos ao mesmo tempo. --preload importa o site antes de abrir a porta.
    startCommand: gunicorn config.wsgi:application --preload --workers 1 --threads 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
